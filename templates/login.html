<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGuard AI - NOC Authentication Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 2.18l7 3.89v4.93c0 4.54-3.14 8.78-7 9.87-3.86-1.09-7-5.33-7-9.87V8.07l7-3.89zM11 7h2v6h-2zm0 8h2v2h-2z"/>
          </svg>
        </div>
        <h1>NetGuard AI</h1>
        <p>Cybersecurity & Telemetry Operations Center</p>
      </div>

      <div class="demo-credentials-pill">
        ⚡ Demo Credentials: User <strong>admin</strong> / Pass <strong>Admin@123</strong>
      </div>

      <div class="alert-message error" id="auth-error-banner"></div>
      <div class="alert-message success" id="auth-success-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username or Corporate Email</label>
          <input type="text" id="login-username" class="form-control" placeholder="e.g. admin or analyst@netguard.ai" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 22px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" id="remember-me" style="accent-color: var(--cyan);">
            Remember Me
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%;">
          <span>Authenticate to NOC</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer">
        Need access? <a href="{{ url_for('register') }}">Register new operator account</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
