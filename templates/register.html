<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGuard AI - Operator Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 2.18l7 3.89v4.93c0 4.54-3.14 8.78-7 9.87-3.86-1.09-7-5.33-7-9.87V8.07l7-3.89zM11 7h2v6h-2zm0 8h2v2h-2z"/>
          </svg>
        </div>
        <h1>Create NOC Account</h1>
        <p>Register as a NetGuard AI Operations Analyst</p>
      </div>

      <div class="alert-message error" id="reg-error-banner"></div>
      <div class="alert-message success" id="reg-success-banner"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Alex Mercer" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Corporate / Security Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="e.g. alex@netguard.ai" required>
        </div>

        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-control" placeholder="e.g. alex_soc" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Password (Minimum 6 characters)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-reg-submit" style="width: 100%; margin-top: 10px;">
          <span>Complete Registration</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="{{ url_for('login') }}">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
